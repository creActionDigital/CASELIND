# Pile de production CASELIND sur un seul serveur (VPS) : PostgreSQL + API + proxy TLS Caddy.
# Non testée (Docker absent de la machine de développement). Voir docs/DEPLOYMENT.md, section « Préparation de l'hébergement ».
#
#   cp deploy/env.production.example deploy/prod.env   # puis remplir (node deploy/gen-secrets.mjs génère les secrets)
#   docker compose -f deploy/docker-compose.yml --env-file deploy/prod.env up -d --build
#
# Une seule instance d'API : limitation de débit, sessions Socket.IO et temps réel sont en mémoire (Redis requis au-delà).
services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: caselind
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD manquant}
      POSTGRES_DB: caselind
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U caselind -d caselind"]
      interval: 10s
      timeout: 5s
      retries: 10
    # Pas de port publié : seule l'API atteint la base, par le réseau interne.

  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: prod.env
    environment:
      NODE_ENV: production
      PORT: "3000"
      DATABASE_URL: postgres://caselind:${POSTGRES_PASSWORD}@db:5432/caselind
      TRUST_PROXY: "true" # derrière Caddy uniquement
      MEDIA_STORAGE_DIR: /data/media
    volumes:
      - media:/data/media
    expose:
      - "3000"

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "80:80"
      - "443:443"
    environment:
      API_DOMAIN: ${API_DOMAIN:?API_DOMAIN manquant (ex. api.exemple.com)}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  pgdata:
  media:
  caddy_data:
  caddy_config:
